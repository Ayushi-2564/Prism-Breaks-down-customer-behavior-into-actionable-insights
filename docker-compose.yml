version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: customer_intelligence_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/customer_intelligence.db
      - MODEL_DIR=/app/ml/models
      - DATASET_PATH=/app/ml/data/customer_churn_dataset.csv
    volumes:
      - ./ml/models:/app/ml/models
      - ./ml/data:/app/ml/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: customer_intelligence_web
    ports:
      - "3000:80"
    depends_on:
      - backend
