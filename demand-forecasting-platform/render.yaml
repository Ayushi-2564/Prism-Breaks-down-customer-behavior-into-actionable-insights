services:
  - type: web
    name: demand-forecasting-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt && python -m ml.src.train_forecaster
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
