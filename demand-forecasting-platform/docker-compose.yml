version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: demand_forecasting_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/demand_forecasting.db
      - MODEL_DIR=/app/ml/models
      - DATASET_PATH=/app/ml/data/kaggle_store_sales.csv
      - PYTHONPATH=/app
    volumes:
      - ./ml/models:/app/ml/models
      - ./ml/data:/app/ml/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: demand_forecasting_web
    ports:
      - "3000:80"
    depends_on:
      - backend
